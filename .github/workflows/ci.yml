name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Full suite, or backend-only retry when app checks already passed
        type: choice
        options: [full, backend]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.4
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  quality:
    if: inputs.verification_scope != 'backend'
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify translation policy and generated rulebook
        run: deno test --allow-env --allow-read supabase/functions/translate-message/*test.ts supabase/functions/prepare-message-jobs/*test.ts
      - name: Verify shell syntax
        run: bash -n scripts/*.sh
      - name: Analyze
        run: flutter analyze
      - name: Test with coverage
        run: flutter test --coverage
      - name: Verify whitespace
        run: git diff --check
      - name: Retain coverage report
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  backend-integration:
    name: Local Supabase integration
    if: ${{ !cancelled() && (needs.quality.result == 'success' || inputs.verification_scope == 'backend') }}
    permissions:
      contents: read
      packages: read
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Resolve dependencies
        run: flutter pub get
      - name: Authenticate container registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Reset disposable backend
        run: scripts/local_test.sh reset
      - name: Verify atomic message batch persistence
        run: |
          project_id=$(sed -nE 's/^project_id = "([^"]+)"/\1/p' supabase/config.toml | head -n 1)
          docker exec -i "supabase_db_${project_id}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/single_call_batches.sql
          docker exec -i "supabase_db_${project_id}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/test_app_boundary.sql
          docker exec -i "supabase_db_${project_id}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/translation_storage_acceptance.sql
          docker exec -i "supabase_db_${project_id}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/reusable_invites.sql
          docker exec -i "supabase_db_${project_id}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/chat_lifecycle.sql
      - name: Verify mention persistence and authority
        run: |
          project_id=$(sed -nE 's/^project_id = "([^"]+)"/\1/p' supabase/config.toml | head -n 1)
          docker exec -i "supabase_db_${project_id}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/message_mentions.sql
      - name: Verify new language persistence and history
        run: |
          project_id=$(sed -nE 's/^project_id = "([^"]+)"/\1/p' supabase/config.toml | head -n 1)
          docker exec -i "supabase_db_${project_id}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/bla13_languages.sql
      - name: Run backend integration suite
        run: scripts/local_test.sh integration
      - name: Stop disposable backend
        if: always()
        run: supabase stop --no-backup

  android-release:
    if: inputs.verification_scope != 'backend'
    name: Android release compile
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Compile non-distributable release bundle
        run: CI=true scripts/ci_android_release.sh
      - name: Verify release bundle exists
        run: test -s build/app/outputs/bundle/release/app-release.aab
      - name: Verify tracked files are unchanged
        run: git diff --exit-code
