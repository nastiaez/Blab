e"></a><figcaption><h2>Offline</h2><p>Only the standard connection banner; sending is disabled.</p></figcaption></figure><figure><a href="screenshots/21-final-native-bob.png"><img src="screenshots/21-final-native-bob.png" alt="Bob’s final installed Android conversation"></a><figcaption><h2>Ready for later verification</h2><p>Bob remains signed in on Android, with Alice’s conversation open in German.</p></figcaption></figure></main><footer>Local verification only. Public Loveblab domain association and store installation remain deferred. Screenshots are real captures, not mockups. <a href="README.md">Verification record</a></footer></html>
